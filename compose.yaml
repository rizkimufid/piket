# Stack dev Piket: hanya Postgres. Aplikasi Next.js tetap jalan di mesin (npm run dev).
#
#   docker compose up -d
#
# Postgres: localhost:5432, user/pass/db = piket

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_INITDB_ARGS: "--locale=C -E UTF-8"
      POSTGRES_USER: piket
      POSTGRES_PASSWORD: piket
      POSTGRES_DB: piket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piket -d piket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: